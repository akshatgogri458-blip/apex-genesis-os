name: Stage APEX Issue 1 Gemini candidate
on:
  push:
    paths:
      - 'imports/APEX_V9_1_ISSUE1_FIX_CANDIDATE*.zip'
      - '.github/workflows/import-issue1-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apex-issue1-candidate-stage
  cancel-in-progress: false
jobs:
  stage-reviewed-issue1-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-1-gemini-candidate
          persist-credentials: true
      - name: Download immutable upload from main
        shell: bash
        run: |
          git fetch origin main
          git show 'origin/main:imports/APEX_V9_1_ISSUE1_FIX_CANDIDATE (1).zip' > /tmp/apex_issue1_candidate.zip
      - name: Verify exact archive and contents
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,zipfile,stat
          from pathlib import Path
          p=Path('/tmp/apex_issue1_candidate.zip')
          expected='564aea12f2f3c3a7e2700a843acff1811ff5793789871ffc5b1c3c9eb4179634'
          if hashlib.sha256(p.read_bytes()).hexdigest()!=expected:
              raise SystemExit('SHA256 mismatch; refusing source import')
          expected_paths={
            'package.json','package-lock.json','scripts/build.cjs','scripts/typecheck.cjs',
            'src/security/auth.ts','src/worker.ts','tests/v9_1_public_repo_and_reliability.test.ts',
            'tsconfig.worker.json'
          }
          with zipfile.ZipFile(p) as z:
              if z.testzip() is not None:raise SystemExit('Corrupt archive')
              entries=[i for i in z.infolist() if not i.is_dir()]
              if set(i.filename for i in entries)!=expected_paths or len(entries)!=len(expected_paths):
                  raise SystemExit('Unexpected file paths or duplicate zip entries')
              for i in entries:
                  if (i.external_attr>>16)&0o170000==stat.S_IFLNK:raise SystemExit('Symbolic links forbidden')
                  data=z.read(i)
                  if len(data)>250000:raise SystemExit('Excessive file size')
                  out=Path(i.filename)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(data)
          PY
      - name: Publish patch on candidate branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json scripts/build.cjs scripts/typecheck.cjs src/security/auth.ts src/worker.ts tests/v9_1_public_repo_and_reliability.test.ts tsconfig.worker.json
          if git diff --cached --quiet; then echo 'No source changes'; else
            git commit -m 'fix(issue1): stage Gemini candidate dependency and typing fixes for CI review'
            git push origin HEAD:fix/issue-1-gemini-candidate
          fi