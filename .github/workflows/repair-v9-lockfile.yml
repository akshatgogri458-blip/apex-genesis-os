name: Repair V9.1 dependency lockfile
on:
  push:
    paths:
      - '.github/workflows/repair-v9-lockfile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate lockfile without running third-party scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check clean install
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          test -x node_modules/.bin/tsc
          node_modules/.bin/tsc --version
      - name: Check lockfile integrity
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pkg=require('./package.json'),lock=require('./package-lock.json');
          if(lock.packages[''].version!==pkg.version) throw new Error('Root version mismatch');
          const count=Object.keys(lock.packages).length;
          if(count<100) throw new Error('Lockfile still incomplete: '+count+' entries');
          if(!lock.packages['node_modules/typescript']?.bin?.tsc) throw new Error('TypeScript binary missing from lockfile');
          console.log('Validated '+count+' complete lockfile package entries');
          NODE
      - name: Commit the generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes required'
          else
            git commit -m 'fix(ci): generate complete V9.1 npm lockfile for reproducible installs'
            git push origin HEAD:main
          fi